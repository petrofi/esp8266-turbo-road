    <text x="180" y="88" text-anchor="middle" font-family="Arial" font-size="19" fill="#a9d8ef">ESP8266 12E</text>
    <g font-family="Arial" font-size="20" fill="#fff">
      <text x="45" y="155">3V3</text>
      <text x="45" y="220">GND</text>
      <text x="45" y="285">D1 / GPIO5</text>
      <text x="45" y="350">D2 / GPIO4</text>
