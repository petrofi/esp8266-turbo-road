<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#f7fafc"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">NodeMCU V3 ESP8266 + 1.3&quot; OLED Bağlantısı</text>

