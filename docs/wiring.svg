    <text x="180" y="48" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#fff">1.3&quot; OLED</text>
    <text x="180" y="115" text-anchor="middle" font-family="Arial" font-size="18" fill="#d6f7ff">128 × 64 SH1106</text>

